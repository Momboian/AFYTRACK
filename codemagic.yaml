# Codemagic CI: builds the AfyaTrack PHO Android APK from the mobile/ folder.
# In Codemagic, add an environment variable group "afyatrack" with API_BASE_URL (e.g. https://pho.example.go.ke).
workflows:
  afyatrack-android:
    name: AfyaTrack PHO Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - afyatrack
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Get packages
        working_directory: mobile
        script: flutter pub get
      - name: Android platform setup
        working_directory: mobile
        script: dart run tool/setup_android.dart && flutter pub get
      - name: Analyze
        working_directory: mobile
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        working_directory: mobile
        script: flutter test
      - name: Build APK
        working_directory: mobile
        script: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
